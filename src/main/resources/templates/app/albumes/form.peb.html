{% extends "fragments/layout" %}

{% block body %}

<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">
      <div class="card">
        <div class="card-header text-center">
          <h3 class="mb-0">
            <i class="bi bi-pencil-square"></i> EDITAR MI ÁLBUM
          </h3>
        </div>
        <div class="card-body p-4">
          <form id="edit-album-form" method="post" action="/app/misalbumes/{{albumId}}/editar">
            <input name="{{ csrfParamName }}" type="hidden" value="{{ csrfToken }}">

            <div class="row">
              <!-- Columna izquierda -->
              <div class="col-md-6">
                <!-- Título -->
                <div class="mb-4">
                  <label class="form-label" for="titulo">
                    <i class="bi bi-music-note-beamed"></i> Título del Álbum
                  </label>
                  <input class="form-control" id="titulo" name="titulo" type="text"
                         value="{{ album.titulo }}" required
                         placeholder="Ej: Sempiternal">
                </div>

                <!-- Género -->
                <div class="mb-4">
                  <label class="form-label" for="genero">
                    <i class="bi bi-tag"></i> Género Musical
                  </label>
                  <input class="form-control" id="genero" name="genero" type="text"
                         value="{{ album.genero }}" required
                         placeholder="Ej: Metalcore">
                </div>

                <!-- Precio -->
                <div class="mb-4">
                  <label class="form-label" for="precio">
                    <i class="bi bi-currency-euro"></i> Precio (€)
                  </label>
                  <input class="form-control" id="precio" name="precio" type="number" step="0.01" min="0"
                         value="{{ album.precio }}" required
                         placeholder="19.99">
                </div>
              </div>

              <!-- Columna derecha -->
              <div class="col-md-6">
                <!-- Fecha de Lanzamiento -->
                <div class="mb-4">
                  <label class="form-label" for="fechaLanzamiento">
                    <i class="bi bi-calendar-event"></i> Fecha de Lanzamiento
                  </label>
                  <input class="form-control" id="fechaLanzamiento" name="fechaLanzamiento" type="date"
                         value="{{ album.fechaLanzamiento }}" required>
                  <small class="form-text text-muted" style="color: var(--text-muted) !important;">
                    Selecciona la fecha usando el calendario
                  </small>
                </div>

                <!-- Portada (URL) -->
                <div class="mb-4">
                  <label class="form-label" for="portada">
                    <i class="bi bi-image"></i> URL de la Portada (Opcional)
                  </label>
                  <input class="form-control" id="portada" name="portada" type="text"
                         value="{{ album.portada }}"
                         placeholder="https://ejemplo.com/portada.jpg">
                  <small class="form-text text-muted" style="color: var(--text-muted) !important;">
                    Deja en blanco para usar imagen por defecto
                  </small>
                </div>
              </div>
            </div>

            <!-- Descripción - Ancho completo -->
            <div class="mb-4">
              <label class="form-label" for="descripcion">
                <i class="bi bi-card-text"></i> Descripción (Opcional)
              </label>
              <textarea class="form-control" id="descripcion" name="descripcion" rows="4"
                        placeholder="Describe el álbum, su contexto, historia, etc.">{{ album.descripcion }}</textarea>
              <small class="form-text text-muted" style="color: var(--text-muted) !important;">
                Añade una descripción detallada del álbum
              </small>
            </div>

            <!-- Botones -->
            <div class="row mt-5">
              <div class="col-md-6 mb-3 mb-md-0">
                <button class="btn btn-primary btn-lg w-100" type="submit">
                  <i class="bi bi-check-circle"></i> ACTUALIZAR ÁLBUM
                </button>
              </div>
              <div class="col-md-6">
                <a href="/app/misalbumes" class="btn btn-secondary btn-lg w-100">
                  <i class="bi bi-x-circle"></i> CANCELAR
                </a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
