{% extends "fragments/layout" %}

{% block body %}

<div class="container">
  <div class="p-5 mb-4 bg-light text-center">
    <h1 class="display-5 fw-bold glow-effect">WHAT LIES BELOW</h1>
    <p class="fs-4 mx-auto">Your Collection of Dark Melodies</p>
    {% if isAuthenticated %}
    <h1 class="display-4">{{ username | default('UNKNOWN') | upper }}</h1>
    {% else %}
    <h1 class="display-4">GUEST</h1>
    {% endif %}
    <p class="mt-5">
      {% if isAdmin %}
      <a class="btn btn-lg btn-primary" href="/admin/albumes">
        Enter Archive
      </a>
      {% else %}
      <a class="btn btn-lg btn-primary" href="/app/misalbumes">
        View Collection
      </a>
      {% endif %}
    </p>
  </div>
</div>

{% endblock %}
